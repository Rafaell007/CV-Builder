# The whole CV for the CV Preview page, put together by the backend from the CV details, skills, projects, user languages
# and profile. The backend checks access: a user gets only their own CV, an admin any CV. Someone else's CV answers
# NOT_FOUND, the same as a missing one (docs/pages/24-cv-preview-page.md).
query CvPreview($cvId: ID!) {
  cvPreview(cvId: $cvId) {
    cvId
    name
    description
    education
    fullName
    position
    domains
    languages {
      name
      proficiency
    }
    skillGroups {
      category
      skills {
        name
        mastery
        experienceYears
        lastUsedYear
      }
    }
    projects {
      name
      description
      domain
      period
      startDate
      endDate
      roles
      responsibilities
      environment
    }
  }
}
