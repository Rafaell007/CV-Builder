# The projects that the CV holds, as ids only, for the Add project modal: they are not offered again (AC-31).
# A document of its own, so a refetch of `CvProjects` after a change does not also run this request while the modal is closed.
query HeldCvProjects($cvId: ID!) {
  cvProjects(cvId: $cvId) {
    id
    project {
      id
    }
  }
}
