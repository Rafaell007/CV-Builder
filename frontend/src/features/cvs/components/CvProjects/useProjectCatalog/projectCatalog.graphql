# The project catalog for the Add project modal. The backend limits `projects` to admins for now (open point KAN-115,
# backend/src/modules/cvs/README.md): a normal user gets FORBIDDEN, and the modal shows that it cannot load the list.
query ProjectCatalog($page: PageInput!) {
  projects(page: $page, sort: { field: "name", direction: ASC }) {
    items {
      id
      name
      domain
      startDate
      endDate
      description
      environment {
        id
        name
      }
    }
    total
  }
}
