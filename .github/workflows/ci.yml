name: CI

on:
  pull_request:
    branches: [development]

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Test-only values for every job. The backend refuses to start without the JWT secrets (32+ characters).
env:
  NODE_ENV: test
  JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else
  JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else

jobs:
  # Fast static checks and the build. Runs in parallel with the test jobs below.
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://cv_builder:cv_builder@localhost:5432/cv_builder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BACKEND_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The typecheck and the build need the generated Prisma client (git-ignored).
      - name: Generate Prisma client
        run: pnpm --filter @cv-builder/backend db:generate

      # Generates the frontend's GraphQL types from the committed schema.gql; lint and typecheck use them.
      - name: Frontend codegen
        run: pnpm --filter @cv-builder/frontend codegen

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # Runs in parallel with the other jobs. The frontend tests were the slowest job (up to 10 minutes on the 2 vCPUs of
  # a runner), so Vitest splits them over 3 shards. Each shard writes a blob report; frontend-tests below merges
  # the reports and checks the coverage thresholds on the whole code base.
  frontend-test-shards:
    name: frontend-test-shards (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Let every shard finish, so one run shows all failing tests.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BACKEND_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The frontend's Storybook tests run in Chromium (Vitest browser mode). Not cached, like the e2e job.
      - name: Install Chromium
        run: pnpm --filter @cv-builder/frontend exec playwright install --with-deps chromium

      # The test script runs codegen first, so no separate codegen step.
      # A private-repo runner has 2 vCPUs and Vitest then starts only 1 worker by default, so the
      # unit test files ran one after another. Two workers halve the time of the step.
      # A shard sees only a third of the code, so test:shard turns the 80 % thresholds off; the merge job checks them.
      - name: Test shard ${{ matrix.shard }}/3
        run: pnpm --filter @cv-builder/frontend test:shard --shard=${{ matrix.shard }}/3 --maxWorkers=2

      - name: Upload blob report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: frontend-blob-report-${{ matrix.shard }}
          path: frontend/.vitest/blob/
          # .vitest is a hidden folder, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 1

  # Merges the 3 blob reports and fails below the 80 % thresholds of vitest.config.mts (PLAN §11.5).
  # Keeps the old job name, so a required status check named frontend-tests keeps working.
  frontend-tests:
    needs: frontend-test-shards
    # Runs even when a shard failed. A skipped job counts as passed for a required check, so the first step fails it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BACKEND_URL: http://localhost:4000

    steps:
      - name: Check that all shards passed
        if: ${{ needs.frontend-test-shards.result != 'success' }}
        run: |
          echo "::error::A frontend test shard did not pass. See the frontend-test-shards jobs."
          exit 1

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          pattern: frontend-blob-report-*
          merge-multiple: true
          path: frontend/.vitest/blob/

      # Does not run tests again: it reads the blobs, prints the result and checks the coverage thresholds.
      - name: Merge reports and check coverage
        run: pnpm --filter @cv-builder/frontend test:merge

  # Runs in parallel with the other jobs.
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://cv_builder:cv_builder@localhost:5432/cv_builder

    # Same image and credentials as docker-compose.yml. Used by schema:generate and the integration tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cv_builder
          POSTGRES_PASSWORD: cv_builder
          POSTGRES_DB: cv_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv_builder -d cv_builder"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Catches the mail sent by the integration tests, like the mailpit service in docker-compose.yml.
      mailpit:
        image: axllent/mailpit:v1.32
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests need the generated Prisma client (git-ignored).
      - name: Generate Prisma client
        run: pnpm --filter @cv-builder/backend db:generate

      # Contract check: schema.gql is committed (D3), so it must match what the code generates.
      - name: Regenerate schema.gql
        run: pnpm --filter @cv-builder/backend schema:generate

      - name: Check that schema.gql is up to date
        run: |
          if ! git diff --exit-code -- backend/schema.gql; then
            echo "::error file=backend/schema.gql::schema.gql is out of date. Run 'pnpm --filter @cv-builder/backend schema:generate' and commit the result."
            exit 1
          fi

      # test:cov runs the same tests and fails below the 80 % thresholds in package.json (PLAN §11.5).
      - name: Unit tests with coverage
        run: pnpm --filter @cv-builder/backend test:cov

      # Uses the Postgres service above; the global setup creates and migrates the cv_builder_test database.
      - name: Integration tests
        run: pnpm --filter @cv-builder/backend test:int

  # Separate job so the slower browser tests run in parallel with the checks above.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Same Postgres as the checks job. e2e:db creates, migrates and seeds cv_builder_test in it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cv_builder
          POSTGRES_PASSWORD: cv_builder
          POSTGRES_DB: cv_builder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv_builder -d cv_builder"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Catches the mail of the sign-up E2E spec, like the mailpit service in docker-compose.yml.
      mailpit:
        image: axllent/mailpit:v1.32
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backend build needs the generated Prisma client (git-ignored).
      - name: Generate Prisma client
        run: pnpm --filter @cv-builder/backend db:generate

      # Not cached: Playwright says restoring the cache takes about as long as downloading (playwright.dev/docs/ci).
      - name: Install Chromium
        run: pnpm --filter @cv-builder/e2e exec playwright install --with-deps chromium

      # playwright.config.ts seeds the database, builds both apps and starts them on ports 3100 / 4100.
      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
