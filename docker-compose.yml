# Local development infrastructure. Credentials here are for local use only.
name: cv-builder

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cv_builder
      POSTGRES_PASSWORD: cv_builder
      POSTGRES_DB: cv_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_builder -d cv_builder"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches outgoing mail: SMTP on 1025, web inbox on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
